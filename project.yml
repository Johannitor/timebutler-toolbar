name: TimebutlerToolbar
options:
  bundleIdPrefix: de.lochimbaum
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  TimebutlerToolbar:
    type: application
    platform: macOS
    sources:
      - TimebutlerToolbar
    info:
      path: TimebutlerToolbar/App/Info.plist
      properties:
        CFBundleDisplayName: Timebutler
        CFBundleName: TimebutlerToolbar
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    entitlements:
      path: TimebutlerToolbar/App/TimebutlerToolbar.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.lochimbaum.TimebutlerToolbar
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TimebutlerToolbarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TimebutlerToolbarTests
    dependencies:
      - target: TimebutlerToolbar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.lochimbaum.TimebutlerToolbarTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  TimebutlerToolbar:
    build:
      targets:
        TimebutlerToolbar: all
    test:
      targets:
        - TimebutlerToolbarTests
